name: Native checks

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        run: ./scripts/build.sh
      - name: Test
        env:
          INDULGE_TEST_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2
        run: ./scripts/test.sh
